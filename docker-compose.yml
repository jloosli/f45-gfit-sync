services:
  f45-gfit-sync:
    build: .
    command: ["tail", "-f", "/dev/null"]
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN_GMAIL=${GOOGLE_REFRESH_TOKEN_GMAIL}
      - GOOGLE_REFRESH_TOKEN_HEALTH=${GOOGLE_REFRESH_TOKEN_HEALTH}
      - LOCAL_TIMEZONE=${LOCAL_TIMEZONE:-America/Denver}
      - EXERCISE_TYPE=${EXERCISE_TYPE:-HIIT}
      - DRY_RUN=${DRY_RUN:-}
    volumes:
      - sync-data:/data
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.sync.schedule: "0 0 7-19 * * *"
      ofelia.job-exec.sync.command: "python -u sync.py"
      ofelia.job-exec.sync.no-overlap: "true"
      ofelia.job-exec.sync.timezone: "${LOCAL_TIMEZONE:-America/Denver}"
    restart: unless-stopped

  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  sync-data:
